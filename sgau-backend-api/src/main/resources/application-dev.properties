# Desarrollo local: PostgreSQL y diagnósticos útiles.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/centro_educativo}
spring.datasource.username=${DB_USERNAME:admin1}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

server.port=${PORT:8080}

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
