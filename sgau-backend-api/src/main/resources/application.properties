spring.application.name=educativo-backend

# Propiedades comunes; los valores por ambiente viven en los perfiles.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# RSA-OAEP: provide both keys through environment variables or Secret Manager.
# The private key must be PKCS#8 PEM and must never be committed.
app.auth.rsa.private-key=${AUTH_RSA_PRIVATE_KEY:}
app.auth.rsa.public-key=${AUTH_RSA_PUBLIC_KEY:}
app.auth.rsa.allow-ephemeral=${AUTH_RSA_ALLOW_EPHEMERAL:false}

# Keep enabled only during migration of clients that still send `password`.
app.auth.login.allow-legacy-password=${ALLOW_LEGACY_PASSWORD:false}
